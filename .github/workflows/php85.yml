name: Build and Push - PHP 85

on:
  push:
    branches:
      - master
    paths:
      - php85/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  IMAGE_NAME: labordigital/docker-base-images-v2
  BASE_TAG: php85

jobs:
  buildAndPush:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to DockerHub Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Die Patch-Version steht in der FROM-Zeile des Basis-Dockerfiles und muss
      # mit der FROM-Zeile des Dev-Dockerfiles uebereinstimmen, sonst wuerde ein
      # Dev-Image mit einer falschen Patch-Version getaggt werden.
      - name: Determine PHP patch version
        id: phpver
        run: |
          BASE_FILE=./${{ env.BASE_TAG }}/${{ env.BASE_TAG }}/Dockerfile
          DEV_FILE=./${{ env.BASE_TAG }}/${{ env.BASE_TAG }}-dev/Dockerfile
          VERSION=$(tr -d '\r' < "$BASE_FILE" | sed -nE 's/^FROM php:([0-9]+\.[0-9]+\.[0-9]+)-apache.*/\1/p')
          DEV_VERSION=$(tr -d '\r' < "$DEV_FILE" | sed -nE 's#^FROM .*:php-([0-9]+\.[0-9]+\.[0-9]+)$#\1#p')
          if [ -z "$VERSION" ]; then
            echo "::error file=$BASE_FILE::Keine PHP-Patch-Version in der FROM-Zeile gefunden"
            exit 1
          fi
          if [ "$VERSION" != "$DEV_VERSION" ]; then
            echo "::error file=$DEV_FILE::Basis-Dockerfile sagt $VERSION, Dev-Dockerfile sagt ${DEV_VERSION:-nichts}"
            exit 1
          fi
          echo "PHP-Patch-Version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Base Image
      - name: Build and push base image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ env.BASE_TAG }}/${{ env.BASE_TAG }}/.
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.BASE_TAG }}
            ${{ env.IMAGE_NAME }}:php-${{ steps.phpver.outputs.version }}
          platforms: linux/amd64,linux/arm64
          file: ./${{ env.BASE_TAG }}/${{ env.BASE_TAG }}/Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Dev Image
      - name: Checkout ssl certs
        uses: actions/checkout@v4
        with:
          repository: labor-digital/ssl-certs
          path: ./${{ env.BASE_TAG }}/${{ env.BASE_TAG }}-dev/ssl
      - name: Build and push dev image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ env.BASE_TAG }}/${{ env.BASE_TAG }}-dev/.
          push: true
          pull: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.BASE_TAG }}-dev
            ${{ env.IMAGE_NAME }}:php-${{ steps.phpver.outputs.version }}-dev
          platforms: linux/amd64,linux/arm64
          file: ./${{ env.BASE_TAG }}/${{ env.BASE_TAG }}-dev/Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max
